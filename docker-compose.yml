version: '3.8'
services:
  fortress:
    build: .
    container_name: hackerwatch-sovereign
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_TOKEN=change-this-token-immediately
    networks:
      - sovereign-net
    restart: unless-stopped

networks:
  sovereign-net:
    driver: bridge
    internal: true
