version: '3.8'
services:
  fortress:
    build: .
    container_name: hackerwatch-sovereign
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_TOKEN=change-this-token-immediately
    networks:
      - sovereign-net
    restart: unless-stopped
    # Security best practices
    user: "node"
    cap_drop:
      - ALL
    read_only: false   # needed for logging

  # Optional: ROS 2 observer (read-only)
  # ros2-bridge:
  #   image: osrf/ros:humble-desktop
  #   container_name: ros2-observer
  #   networks:
  #     - sovereign-net
  #   command: ros2 topic list
  #   restart: unless-stopped

networks:
  sovereign-net:
    driver: bridge
    internal: true
