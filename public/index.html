<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>HackerWatch Sovereign v3.0</title>  <style>    body {       background: #0a0a0a;       color: #00ff00;       font-family: monospace;       padding: 20px;       margin: 0;     }    .banner {       background: #ff0000;       color: #000;       padding: 15px;       text-align: center;       font-weight: bold;       letter-spacing: 1px;     }    .badge-container {      margin: 15px 0;      display: flex;      gap: 10px;      flex-wrap: wrap;    }    .badge {      padding: 5px 10px;      font-size: 0.85em;      font-weight: bold;      border-radius: 3px;      text-transform: uppercase;    }    .badge-wireshark { background: #004080; color: #fff; border: 1px solid #0059b3; }    .badge-ros { background: #e67e22; color: #fff; border: 1px solid #d35400; }    .status { color: #00ff88; font-size: 1.3em; margin: 15px 0; }    .log {       background: #111;       padding: 15px;       margin: 15px 0;       height: 380px;       overflow-y: scroll;       border: 1px solid #003300;       white-space: pre-wrap;    }    button {       background: #00aa00;       color: #000;       padding: 10px 18px;       margin: 8px 8px 8px 0;       border: none;       cursor: pointer;       font-family: monospace;       font-weight: bold;    }    button:hover { background: #00ff00; }  </style></head><body>  <div class="banner">HACKERWATCH FORTRESS - SOVEREIGN v3.0 • NO GOVERNMENT TIES</div>    <div class="badge-container">    <span class="badge badge-wireshark">📡 WIRESHARK CAPABLE (HOST LEVEL)</span>    <span class="badge badge-ros">🤖 ROS 2 BRIDGE COMPATIBLE</span>  </div>    <h2 class="status">● SYSTEM STATUS: <span id="status">CONNECTING...</span></h2>    <button onclick="clearLog()">Clear Log</button>  <button onclick="window.location.reload()">Refresh Interface</button>  <h3>Sovereign Monitoring Channel</h3>  <div id="log" class="log"></div>  <p><strong>Contact:</strong> lexalytics@yahoo.com</p>  <p><strong>Emmanuel - God With Us</strong></p>  <script>    const logDiv = document.getElementById('log');    const statusSpan = document.getElementById('status');    function addLog(message) {      const time = new Date().toLocaleTimeString();      const entry = document.createElement('div');      entry.textContent = `[${time}] ${message}`;      logDiv.appendChild(entry);      logDiv.scrollTop = logDiv.scrollHeight;    }    function clearLog() {      if (confirm('Clear the security log?')) {        logDiv.innerHTML = '';        addLog('Log cleared by operator.');      }    }    // Connect directly to the updated server.js WebSocket channel    const ws = new WebSocket('ws://127.0.0.1:8080?token=change-this-token-immediately');    ws.onopen = () => {      statusSpan.textContent = 'AIR-GAPPED • SECURE WS CHANNEL ACTIVE';      statusSpan.style.color = '#00ff88';    };    ws.onmessage = (event) => {      const data = JSON.parse(event.data);      if (data.type === 'SYSTEM') {        addLog(`[SYSTEM] ${data.message}`);      } else if (data.type === 'MONITOR') {        addLog(`[TELEMETRY] CPU Load: ${data.payload.cpuLoad} | RAM Used: ${data.payload.memoryUsedMB} MB | ${data.payload.message}`);      }    };    ws.onerror = (err) => {      addLog('[ERROR] WebSocket handshake failed. Check server log.');      statusSpan.textContent = 'DISCONNECTED';      statusSpan.style.color = '#ff0000';    };    ws.onclose = () => {      addLog('[SYSTEM] Connection closed by host.');      statusSpan.textContent = 'OFFLINE';      statusSpan.style.color = '#ff0000';    };  </script></body></html>
